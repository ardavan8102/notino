name: notino
description: "NoteBook Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.4.2
  flutter_quill: ^11.5.1
  local_auth: ^3.0.2  # authorization for private notes with fingerprint
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2
  flutter_gen: ^5.15.0
  animated_text_kit: ^4.3.0 # Animated texts
  material_symbols_icons: ^4.2960.0 # source : https://timmaffett.github.io/material_symbols_icons/

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

