name: notino
description: "NoteBook Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.4.2
  flutter_quill: ^11.5.1
  local_auth: ^3.0.2  # authorization for private notes with fingerprint
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  carousel_slider: ^5.1.2
  flutter_gen: ^5.15.0
  animated_text_kit: ^4.3.0 # Animated texts
  lucide_icons_flutter: ^3.0.0
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.9.2
  build_runner: ^2.15.1

flutter:

  uses-material-design: true

  assets:
    - assets/img/image_note_bg.webp

  fonts:
    - family: Dana
      fonts:
        - asset: assets/font/dana/DanaFaNum-Black.ttf
          weight: 900
        - asset: assets/font/dana/DanaFaNum-Bold.ttf
          weight: 700
        - asset: assets/font/dana/DanaFaNum-Medium.ttf
          weight: 500
        - asset: assets/font/dana/DanaFaNum-Regular.ttf
          weight: 400
        - asset: assets/font/dana/DanaFaNum-Light.ttf
          weight: 300